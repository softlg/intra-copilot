services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: intra_copilot
      POSTGRES_USER: intra
      POSTGRES_PASSWORD: intra
    ports:
      - "5432:5432"
    volumes:
      - intra-copilot-postgres:/var/lib/postgresql/data

volumes:
  intra-copilot-postgres:
