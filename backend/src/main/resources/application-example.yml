server:
  port: 8080
  address: 127.0.0.1
spring:
  ai:
    openai:
      base-url: https://api.openai.com/v1
      api-key: replace-me
      chat:
        # Base URL includes /v1; Spring AI appends this relative path.
        completions-path: /chat/completions
        options:
          model: gpt-4o-mini
          temperature: 0.2
      embedding:
        base-url: https://api.openai.com/v1
        api-key: replace-me
        embeddings-path: /embeddings
        options:
          model: text-embedding-3-small
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/intra_copilot
    username: intra
    password: replace-me
  flyway:
    enabled: true
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
mybatis-plus:
  configuration.map-underscore-to-camel-case: true
embedding:
  default-provider: openai
  dimension: 1536
  providers:
    openai:
      base-url: https://api.openai.com/v1
      api-key: replace-me
      path: /embeddings
rag:
  top-k: 5
  chunk-size: 1200
  chunk-overlap: 200
  chunk-max-tokens: 800
  similarity-threshold: 0.50
  retrieval-mode: HYBRID
  lexical-weight: 0.30
  fallback-enabled: true
  max-document-bytes: 10485760
  max-embedded-attachment-bytes: 20971520
ocr:
  enabled: false
  command: tesseract
  languages: chi_sim+eng
  pdf-dpi: 180
  pdf-min-text-characters: 80
  timeout-seconds: 90
  max-characters: 200000
agent:
  llm-timeout-seconds: 180
  sse-timeout-seconds: 600
tools:
  allow-http: false
  allow-private-network: false
mcp:
  timeout-ms: 8000
  allow-private-network: false
  allow-stdio: false
  health-check-interval-ms: 300000
  session-idle-ms: 300000
app:
  security:
    require-secure-admin-config: true
  stream:
    core-threads: 4
    max-threads: 16
    queue-capacity: 200
    heartbeat-seconds: 15
  # 管理端开发服务器默认使用 4174；插件来源请替换为实际扩展 ID。
  cors-origins: chrome-extension://YOUR_EXTENSION_ID,http://localhost:4174,http://127.0.0.1:4174
admin:
  username: admin
  password: replace-me
  session-ttl-minutes: 480
  # Production deployments should set this to a long random value.
  session-secret: replace-me
