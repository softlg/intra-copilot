server:
  port: 8080
  address: 127.0.0.1
spring:
  ai:
    openai:
      base-url: https://api.openai.com/v1
      api-key: replace-me
      chat:
        # Base URL includes /v1; Spring AI appends this relative path.
        completions-path: /chat/completions
        options:
          model: gpt-4o-mini
          temperature: 0.2
      embedding:
        base-url: https://api.openai.com/v1
        api-key: replace-me
        embeddings-path: /embeddings
        options:
          model: text-embedding-3-small
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/intra_copilot
    username: intra
    password: replace-me
  flyway:
    enabled: true
mybatis-plus:
  configuration.map-underscore-to-camel-case: true
embedding:
  default-provider: openai
  dimension: 1536
  providers:
    openai:
      base-url: https://api.openai.com/v1
      api-key: replace-me
      path: /embeddings
rag:
  top-k: 5
  chunk-size: 1200
  chunk-overlap: 200
  similarity-threshold: 0.65
  max-document-bytes: 10485760
agent:
  llm-timeout-seconds: 180
  sse-timeout-seconds: 600
tools:
  # Set to false in public deployments to enforce HTTPS-only, public endpoints.
  allow-http: true
  allow-private-network: true
mcp:
  timeout-ms: 8000
  allow-private-network: true
app:
  # 管理端开发服务器默认使用 4174；插件来源请替换为实际扩展 ID。
  cors-origins: chrome-extension://YOUR_EXTENSION_ID,http://localhost:4174,http://127.0.0.1:4174
admin:
  username: admin
  password: replace-me
  session-ttl-minutes: 480
  # Production deployments should set this to a long random value.
  session-secret: replace-me
