server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:127.0.0.1}
spring:
  ai:
    openai:
      base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
      api-key: ${LLM_API_KEY:}
      chat:
        # LLM_BASE_URL should include the provider API prefix (normally /v1).
        # Spring AI appends this path to the configured base URL.
        completions-path: ${LLM_COMPLETIONS_PATH:/chat/completions}
        options:
          model: ${LLM_MODEL:gpt-4o-mini}
          temperature: 0.2
      embedding:
        base-url: ${EMBEDDING_BASE_URL:${LLM_BASE_URL:https://api.openai.com/v1}}
        api-key: ${EMBEDDING_API_KEY:${LLM_API_KEY:}}
        # Keep the endpoint relative to EMBEDDING_BASE_URL.  The previous
        # default (/v1/embeddings) produced /v1/v1/embeddings when the
        # conventional .../v1 base URL was used, resulting in HTTP 404.
        embeddings-path: ${EMBEDDING_PATH:/embeddings}
        options:
          model: ${EMBEDDING_MODEL:text-embedding-3-small}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/intra_copilot}
    username: ${DATABASE_USERNAME:intra}
    password: ${DATABASE_PASSWORD:intra}
  flyway:
    enabled: true
    locations: classpath:db/migration
  webflux:
    multipart:
      max-in-memory-size: 100MB
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 200MB
mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration.map-underscore-to-camel-case: true
management:
  endpoints.web.exposure.include: health,info
embedding:
  default-provider: ${EMBEDDING_PROVIDER:openai}
  dimension: ${EMBEDDING_DIMENSION:1536}
  # Transient provider failures (429/5xx/network) are retried with exponential backoff.
  max-attempts: ${EMBEDDING_MAX_ATTEMPTS:3}
  retry-backoff-ms: ${EMBEDDING_RETRY_BACKOFF_MS:1000}
  providers:
    openai:
      base-url: ${EMBEDDING_BASE_URL:${LLM_BASE_URL:https://api.openai.com/v1}}
      api-key: ${EMBEDDING_API_KEY:${LLM_API_KEY:}}
      path: ${EMBEDDING_PATH:/embeddings}
      qps: ${EMBEDDING_OPENAI_QPS:60}
      cost-per-1k-tokens: ${EMBEDDING_OPENAI_COST_PER_1K:0.00002}
rag:
  top-k: ${RAG_TOP_K:5}
  chunk-size: ${RAG_CHUNK_SIZE:1200}
  chunk-overlap: ${RAG_CHUNK_OVERLAP:200}
  similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.65}
  max-document-bytes: ${RAG_MAX_DOCUMENT_BYTES:104857600}
kb:
  indexing:
    enabled: ${KB_INDEXING_ENABLED:true}
    concurrency: ${KB_INDEXING_CONCURRENCY:2}
    poll-interval-ms: ${KB_INDEXING_POLL_INTERVAL_MS:1000}
    max-attempts: ${KB_INDEXING_MAX_ATTEMPTS:3}
tools:
  # 内网部署场景可使用 HTTP 和本机服务；仍会拒绝云元数据地址。
  allow-http: ${TOOLS_ALLOW_HTTP:true}
  allow-private-network: ${TOOLS_ALLOW_PRIVATE_NETWORK:true}
mcp:
  timeout-ms: ${MCP_TIMEOUT_MS:8000}
  allow-private-network: ${MCP_ALLOW_PRIVATE_NETWORK:true}
app:
  cors-origins: ${CORS_ALLOWED_ORIGINS:chrome-extension://*,http://localhost:4174,http://127.0.0.1:4174,http://localhost:5173,http://127.0.0.1:5173}
  # 单条聊天附件最大体积（字节）。servlet 上限见 spring.servlet.multipart。
  max-attachment-bytes: ${APP_MAX_ATTACHMENT_BYTES:26214400}
minio:
  # 设为 true 时，文档与聊天附件统一存储到 MinIO；否则使用本地磁盘（默认）。
  enabled: ${MINIO_ENABLED:false}
  endpoint: ${MINIO_ENDPOINT:}
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}
  bucket: ${MINIO_BUCKET:intra-copilot}
  region: ${MINIO_REGION:}
